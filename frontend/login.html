<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de login - BookCeep</title>
  <!-- Vínculo com o arquivo CSS na mesma pasta -->
  <link rel="stylesheet" href="style.css">
  <!-- Fonte Playfair Display e Inter do Google Fonts (usadas no seu Figma) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="login-box">
    <!-- Título com a fonte clássica serifada do Figma -->
    <h1 class="brand-title">BookCeep</h1>

    <h2>Abra uma conta</h2>
    <p class="subtitle">Digite seu e-mail para se inscrever</p>

    <form id="formLogin">
      <div class="field">
        <input type="email" id="email" placeholder="email@dominio.com" required autocomplete="off">
      </div>

      <button type="submit" class="btn-email">Cadastre-se com e-mail</button>
    </form>

    <div class="separator">
      <span>ou continue com</span>
    </div>

    <button type="button" class="btn-google" id="btnGoogle">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      Google
    </button>

    <p class="legal-text">
      Ao continuar, você concorda com os nossos <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a>
    </p>
  </div>

  <script src="login.js"></script>
</body>
</html>
