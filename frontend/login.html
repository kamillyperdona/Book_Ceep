<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BookCeep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-box">
    <h1 class="brand-title">BookCeep</h1>
    
    <h2>Acesso ao Sistema</h2>
    <p class="subtitle">Digite suas credenciais para entrar</p>

    <form id="formLogin">
      <!-- Campo de E-mail -->
      <div class="field">
        <input type="email" id="email" placeholder="email@dominio.com" required>
      </div>

      <!-- Campo de Senha com o ícone de olho SVG -->
      <div class="field" style="position: relative;">
        <input type="password" id="senha" placeholder="Sua senha" required style="padding-right: 40px;">
        
        <button type="button" id="toggleSenha" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; outline: none;">
          <svg id="iconEye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>

      <!-- Mensagem de erro -->
      <p id="mensagemErro" style="color: #d32f2f; font-size: 0.78rem; margin-top: 8px; display: none; text-align: left;"></p>

      <!-- ÚNICO Botão de Entrar -->
      <button type="submit" class="btn-email" style="margin-top: 10px;">Entrar no sistema</button>
    </form>

    <div class="separator">
      <span>ou</span>
    </div>

    <!-- Opção de Recuperar Senha -->
    <button type="button" id="btnEsqueceuSenha" style="background-color: transparent; border: none; color: #1e2b37; font-weight: 600; cursor: pointer; text-decoration: underline; font-size: 0.85rem;">
      Esqueceu a sua senha?
    </button>

    <!-- Rodapé com links clicáveis -->
    <p class="legal-text">
      Ao continuar, você concorda com os nossos 
      <a href="#" id="linkTermos">Termos de Serviço</a> e 
      <a href="#" id="linkPrivacidade">Política de Privacidade</a>.
    </p>
  </div>

  <!-- Modal de Recuperação de Senha -->
  <div id="modalRecuperar" class="modal-overlay">
    <div class="modal-card">
      <h2>Recuperar Senha</h2>
      <p class="subtitle" style="margin-bottom: 15px;">Digite o seu e-mail cadastrado para receber as instruções.</p>
      <form id="formRecuperar">
        <input type="email" id="emailRecuperar" placeholder="seu.email@ceep.com" required>
        <div class="modal-buttons">
          <button type="button" id="btnCancelarRecuperar" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-save">Enviar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de Termos de Serviço e Privacidade -->
  <div id="modalTermos" class="modal-overlay">
    <div class="modal-card" style="max-width: 550px; max-height: 85vh; overflow-y: auto;">
      <h2 id="tituloModalTermos">Termos de Serviço</h2>
      
      <div id="conteudoModalTermos" style="text-align: left; font-size: 0.85rem; color: #444; line-height: 1.6; margin: 15px 0;">
        <!-- O texto profissional será inserido via JS conforme o clique -->
      </div>

      <div class="modal-buttons">
        <button type="button" id="btnFecharTermos" class="btn-save">Compreendido</button>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
