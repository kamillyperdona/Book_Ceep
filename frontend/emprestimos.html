<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empréstimo - BookCeep</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-home">

  <!-- NAVBAR SUPERIOR -->
  <header class="navbar">
    <div class="nav-left">
      <svg class="logo-icon" width="26" height="20" viewBox="0 0 28 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 3.5C2 2.67157 2.67157 2 3.5 2H12.5C13.3284 2 14 2.67157 14 3.5V19.5C14 20.0523 13.5523 20.5 13 20.5H3.5C2.67157 20.5 2 19.8284 2 19V3.5Z" stroke="#1E2B37" stroke-width="2" stroke-linecap="round"/>
        <path d="M26 3.5C26 2.67157 25.3284 2 24.5 2H15.5C14.6716 2 14 2.67157 14 3.5V19.5C14 20.0523 14.4477 20.5 15 20.5H24.5C25.3284 20.5 26 19.8284 26 19V3.5Z" stroke="#1E2B37" stroke-width="2" stroke-linecap="round"/>
        <path d="M14 4V19.5C14 20.0523 14.4477 20.5 15 20.5H13C12.4477 20.5 12 20.0523 12 19.5V4" fill="#1E2B37"/>
      </svg>
      <span class="logo-text">BookCeep</span>
    </div>

    <nav class="nav-links">
      <a href="livros.html">Livro</a>
      <a href="emprestimos.html" class="active">Empréstimo</a>
      <a href="alunos.html">Aluno</a>
    </nav>

    <div class="user-badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Administrador CEEP</span>
    </div>
  </header>

  <main class="main-content-wide">
    <h1 class="page-title">Empréstimos</h1>
    <p class="section-subtitle" style="margin-top: -15px; margin-bottom: 25px;">Alunos selecionados para consulta.</p>

    <!-- BARRA DE PESQUISA E AÇÃO NO MESMO PADRÃO -->
    <div class="search-bar-row">
      <div class="search-input-wrapper">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="inputBuscaEmprestimo" placeholder="Busque por alunos ou empréstimos...">
      </div>
      <button id="btnConsultarEmprestimo" class="btn-consultar">Consultar</button>
    </div>

    <!-- BOTÃO DE CADASTRO LOGO ABAIXO DA BUSCA -->
    <div class="actions-bar">
      <button id="btnOpenModal" class="btn-cadastrar-livro">+ Novo Empréstimo</button>
    </div>

    <!-- GRID DE EMPRÉSTIMOS -->
    <div class="books-grid" id="gridEmprestimos" style="margin-top: 30px;">
      <!-- Cards de empréstimos serão carregados aqui -->
    </div>
  </main>

  <!-- MODAL DE REGISTRO DE EMPRÉSTIMO -->
  <div id="modalEmprestimo" class="modal-overlay">
    <div class="modal-card" style="max-width: 450px;">
      <h2>Novo Empréstimo</h2>
      <form id="formCadastrarEmprestimo">
        
        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.8rem; font-weight: 600; color: #333; display: block; margin-bottom: 4px;">Aluno (Cadastrado):</label>
          <select id="selectAluno" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;" required>
            <option value="">Selecione o aluno...</option>
          </select>
        </div>

        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.8rem; font-weight: 600; color: #333; display: block; margin-bottom: 4px;">Livro / Exemplar Disponível:</label>
          <select id="selectLivro" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;" required>
            <option value="">Selecione o livro...</option>
          </select>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
          <div style="flex: 1;">
            <label style="font-size: 0.75rem; color: #666; display: block; margin-bottom: 4px;">Data Emissão:</label>
            <input type="text" id="dataEmissao" disabled style="background-color: #f0f0f0; width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div style="flex: 1;">
            <label style="font-size: 0.75rem; color: #666; display: block; margin-bottom: 4px;">Devolução (2 meses):</label>
            <input type="text" id="dataDevolucao" disabled style="background-color: #f0f0f0; width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          </div>
        </div>

        <div class="modal-buttons">
          <button type="button" id="btnCloseModalEmprestimo" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-save">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- RODAPÉ ESCURO -->
  <footer class="footer-dark">
    <div class="footer-content">
      <h3>Biblioteca Escolar BookCeep</h3>
      <p>&copy; 2026 Biblioteca Escolar BookCeep - Leitura para todos.</p>
    </div>
  </footer>

  <script src="emprestimos.js"></script>
</body>
</html>
