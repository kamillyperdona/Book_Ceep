<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Livros - BookCeep</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-home">

  <!-- NAVBAR SUPERIOR -->
  <header class="navbar">
    <div class="nav-left">
      <svg class="logo-icon" width="26" height="20" viewBox="0 0 28 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 3.5C2 2.67157 2.67157 2 3.5 2H12.5C13.3284 2 14 2.67157 14 3.5V19.5C14 20.0523 13.5523 20.5 13 20.5H3.5C2.67157 20.5 2 19.8284 2 19V3.5Z" stroke="#1E2B37" stroke-width="2" stroke-linecap="round"/>
        <path d="M26 3.5C26 2.67157 25.3284 2 24.5 2H15.5C14.6716 2 14 2.67157 14 3.5V19.5C14 20.0523 14.4477 20.5 15 20.5H24.5C25.3284 20.5 26 19.8284 26 19V3.5Z" stroke="#1E2B37" stroke-width="2" stroke-linecap="round"/>
        <path d="M14 4V19.5C14 20.0523 14.4477 20.5 15 20.5H13C12.4477 20.5 12 20.0523 12 19.5V4" fill="#1E2B37"/>
      </svg>
      <span class="logo-text">BookCeep</span>
    </div>

    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="livros.html" class="active">Livro</a>
      <a href="emprestimos.html">Empréstimo</a>
      <a href="alunos.html">Aluno</a>
    </nav>

    <div class="user-badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span id="nomeFuncionario">Nome do funcionário</span>
    </div>
  </header>

  <main class="main-content-wide">
    <h1 class="page-title">Explore o acervo da escola.</h1>

    <!-- BARRA DE BUSCA EXCLUSIVA POR TÍTULO E BOTÃO CONSULTAR -->
    <div class="search-bar-row">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="inputBusca" placeholder="Busque por título do livro...">
      </div>
      <button class="btn-consultar" id="btnConsultar">Consultar</button>
    </div>

    <!-- BOTÃO CADASTRAR LIVRO -->
    <div class="actions-bar">
      <button class="btn-cadastrar-livro" id="btnOpenModal">+ Cadastrar livro</button>
    </div>

    <!-- GRID DE LIVROS E PAGINAÇÃO DINÂMICA -->
    <section class="catalog-content-full">
      <div class="books-grid" id="gridLivrosCatalogo">
        <!-- Livros vindos do banco serão renderizados aqui -->
      </div>

      <!-- PAGINAÇÃO GERADA DINAMICAMENTE -->
      <div class="pagination" id="paginacaoContainer"></div>
    </section>
  </main>

  <!-- MODAL PARA CADASTRAR NOVO LIVRO COM EXEMPLARES -->
  <div class="modal-overlay" id="modalLivro">
    <div class="modal-card">
      <h2>Cadastrar Novo Livro</h2>
      <form id="formCadastrarLivro">
        <input type="text" id="tituloLivro" placeholder="Título do livro" required>
        <input type="text" id="isbnLivro" placeholder="ISBN (Ex: 9788538081234)" required>
        <input type="number" id="anoLivro" placeholder="Ano de publicação (Ex: 2023)" required>
        <input type="number" id="qtdExemplares" placeholder="Quantidade de exemplares físicos" min="1" value="1" required>
        <div class="modal-buttons">
          <button type="button" class="btn-cancel" id="btnCloseModal">Cancelar</button>
          <button type="submit" class="btn-save">Salvar no Banco</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer-dark">
    <div class="footer-content">
      <h3>Biblioteca Escolar BookCeep</h3>
      <p>&copy; 2026 Biblioteca Escolar BookCeep - Leitura para todos.</p>
    </div>
  </footer>

  <script src="livros.js"></script>
</body>
</html>
